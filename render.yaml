services:
  - type: web
    name: allira-bot
    env: python
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NEWS_CHANNEL_ID
        sync: false
      # NFT-коллекции для постов: Имя:адрес,Имя2:адрес2. Пусто — дефолт.
      - key: NFT_COLLECTIONS
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: CREATOR_USER_IDS
        sync: false
      - key: CREATOR_USERNAME
        value: "hinorum"
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: "INFO"
      - key: TZ
        value: "Europe/Moscow"
      - key: MARKETAPP_API_KEY
        sync: false
      - key: MARKETAPP_WALLET
        sync: false
      - key: TONCENTER_API_KEY
        sync: false
      - key: TONAPI_API_KEY
        sync: false
      # Крипто-бухгалтерия. Пусто — модуль выключен (работает ручной ввод
      # и CoinGecko). CEX-ключи read-only: дают историю сделок, но не вывод.
      - key: TAXPAYER_INN
        sync: false
      - key: TAX_STATUS
        value: "resident"
      - key: COST_BASIS_METHOD
        value: "fifo"
      - key: CRYPTO_OWNER_ID
        sync: false
      - key: CBR_API_URL
        value: "https://www.cbr-xml-daily.ru"
      - key: BYBIT_API_KEY
        sync: false
      - key: BYBIT_API_SECRET
        sync: false
      - key: OKX_API_KEY
        sync: false
      - key: OKX_API_SECRET
        sync: false
      - key: OKX_PASSPHRASE
        sync: false
      # Веб-панель /admin. Пусто — панель отдаёт 401 и выключена.
      # Длинная случайная строка:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      - key: ADMIN_PANEL_TOKEN
        sync: false
