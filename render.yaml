services:
  - type: web
    name: allira-bot
    env: python
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NEWS_CHANNEL_ID
        sync: false
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: "INFO"
      - key: TZ
        value: "Europe/Moscow"
      - key: MARKETAPP_API_KEY
        sync: false
      - key: MARKETAPP_WALLET
        sync: false
