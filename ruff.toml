# Минимальный набор правил для CI: только то, что ломает выполнение или
# почти наверняка указывает на баг. Полный набор ruff в старом коде даёт
# сотни стилевых замечаний — их чистка должна идти отдельной задачей.
target-version = "py311"
line-length = 120

[lint]
select = [
    "E9",    # синтаксические ошибки и сломанные файлы
    "F63",   # неверные сравнения (is с литералом и т.п.)
    "F7",    # ошибки разбора/некорректный синтаксис
    "F82",   # неопределённые имена
    "F811",  # повторное определение неиспользуемого имени
]

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
]
